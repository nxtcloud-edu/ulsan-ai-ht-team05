<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRAPER</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #191f28;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .phone {
      width: min(430px, 96vw);
      height: min(764px, 92vh);
      aspect-ratio: 9 / 16;
      background: #fff;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .12);
      overflow: hidden;
      position: relative;
      border: 1px solid #e8edf2;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .sidebar {
      width: 132px;
      height: 100%;
      background: #f8fafc;
      border-right: 1px solid #eef1f4;
      padding: 18px 10px;
      transition: width .25s ease;
      position: relative;
      flex-shrink: 0;
    }

    .sidebar.collapsed { width: 52px; }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: #8b95a1;
      margin: 36px 4px 12px;
      white-space: nowrap;
      overflow: hidden;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category {
      border: none;
      background: transparent;
      text-align: left;
      padding: 10px 10px;
      border-radius: 10px;
      font-size: 13px;
      color: #4e5968;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }

    .category:hover,
    .category.active {
      background: #edf4ff;
      color: #1b64da;
      font-weight: 700;
    }

    .sidebar.collapsed .category,
    .sidebar.collapsed .sidebar-title {
      font-size: 0;
    }

    .sidebar.collapsed .category::before {
      content: "•";
      font-size: 18px;
      color: #8b95a1;
      display: block;
      text-align: center;
    }

    .toggle-sidebar {
      position: absolute;
      top: 14px;
      right: 10px;
      width: 30px;
      height: 30px;
      border: none;
      background: #fff;
      border-radius: 9px;
      box-shadow: none;
      border: 1px solid #e9edf2;
      cursor: pointer;
      font-size: 15px;
      color: #6b7684;
    }

    .main {
      flex: 1;
      height: 100%;
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 66px;
      padding: 16px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f0f2f5;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 5;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.6px;
      white-space: nowrap;
    }

    .mode-button {
      border: none;
      background: #f2f4f6;
      color: #4e5968;
      font-weight: 700;
      font-size: 11px;
      padding: 8px 11px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .mode-button:hover { background: #e9edf2; }

    .content {
      flex: 1;
      overflow: auto;
      padding: 24px 16px 112px;
      position: relative;
    }

    /* 채팅 모드(업로드/검색)에서는 content 자체를 스크롤하지 않고
       내부 메시지 영역만 스크롤해서 composer가 하단에 고정되도록 함 */
    .app.chat-mode .content {
      overflow: hidden;
      padding-bottom: 24px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .notice {
      background: #f8fafc;
      color: #6b7684;
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 12px;
      line-height: 1.55;
      margin-bottom: 16px;
      border: 1px solid #eef1f4;
    }

    .notice strong { color: #333d4b; }

    .home-card {
      width: 100%;
      min-height: 142px;
      border-radius: 20px;
      border: 1px solid #edf0f3;
      background: #fff;
      padding: 20px 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: .2s ease;
      text-align: left;
    }

    .home-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(15, 23, 42, .06);
      border-color: #dde3ea;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: #191f28;
      letter-spacing: -0.35px;
    }

    .card-desc {
      font-size: 12.5px;
      color: #8b95a1;
      line-height: 1.55;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #edf4ff;
      color: #3182f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .chat-wrap {
      display: none;
      height: 100%;
      flex-direction: column;
      min-height: 0;
    }

    .chat-wrap.active { display: flex; }

    /* 메시지 영역만 스크롤 */
    .chat-wrap.active > #uploadMessages,
    .chat-wrap.active > #retrieveMessages {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
      padding-bottom: 8px;
    }

    /* composer는 흐름 마지막에 고정 배치 */
    .chat-wrap.active > .composer {
      flex: 0 0 auto;
      position: static;
      left: auto;
      right: auto;
      bottom: auto;
      margin-top: 10px;
    }

    .empty-state {
      flex: 1;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 8px 140px;
      width: 100%;
    }

    /* 채팅 모드에서는 composer가 흐름에 포함되므로 하단 여백/최소높이 축소 */
    .chat-wrap.active > .empty-state {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 30px 8px;
    }

    #retrieveView .empty-state > div {
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .empty-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.45px;
    }

    .empty-desc {
      color: #8b95a1;
      font-size: 13px;
      line-height: 1.5;
    }

    .composer {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 18px;
      border: 1px solid #e2e7ec;
      background: #fff;
      border-radius: 20px;
      padding: 9px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .07);
    }

    .composer-top {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .upload-btn {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: #f4f6f8;
      cursor: pointer;
      font-size: 17px;
    }

    .text-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      min-width: 0;
      padding: 8px 4px;
      color: #333d4b;
    }

    .send-btn {
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #3182f6;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .composer-note {
      margin-top: 7px;
      font-size: 10px;
      color: #a1a8b3;
      padding-left: 3px;
    }

    .home-view { display: block; }
    .home-view.hidden { display: none; }

    .back-link {
      display: none;
      border: none;
      background: transparent;
      color: #8b95a1;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }

    .chat-mode .back-link { display: inline-block; }

    @media (max-width: 390px) {
      .sidebar { width: 115px; }
      .brand { font-size: 17px; }
      .mode-button { padding: 7px 8px; }
    }
  
  /* ===== Requested additions only ===== */

  /* Center prompt: wide horizontal blue glow behind the text */
  .empty-state > div {
    position: relative;
    z-index: 1;
  }

  .empty-state > div::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -54%);
    width: 310px;
    height: 130px;
    border-radius: 999px;
    background:
      radial-gradient(
        ellipse at center,
        rgba(176, 217, 255, 0.62) 0%,
        rgba(200, 228, 255, 0.40) 44%,
        rgba(222, 239, 255, 0.18) 68%,
        rgba(255, 255, 255, 0) 82%
      );
    filter: blur(12px);
    pointer-events: none;
    z-index: -1;
  }

  /* Keep prompt text crisp above the glow */
  .empty-title,
  .empty-desc {
    position: relative;
    z-index: 2;
  }

  /* Unified soft-blue button treatment */
  .mode-button,
  .upload-btn,
  .send-btn,
  .toggle-sidebar {
    background: #eaf2ff !important;
    color: #2f6fed !important;
    border-color: #e2ebfb !important;
    box-shadow: none !important;
  }

  .mode-button:hover,
  .upload-btn:hover,
  .send-btn:hover,
  .toggle-sidebar:hover {
    background: #deebff !important;
  }

  /* Match the small action/icon blocks to the same tone */
  .card-icon {
    background: #eaf2ff !important;
    color: #2f6fed !important;
  }


  .add-category-btn {
    width: 100%;
    height: 36px;
    margin-top: 10px;
    border: 1px dashed #cfdaf0;
    background: #eaf2ff;
    color: #2f6fed;
    border-radius: 10px;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    transition: .18s ease;
  }

  .add-category-btn:hover {
    background: #deebff;
  }

  .sidebar.collapsed .add-category-btn {
    width: 32px;
    margin-left: auto;
    margin-right: auto;
    padding: 0;
    font-size: 18px;
  }


  /* ===== Splash screen ===== */
  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    visibility: visible;
    transition: opacity .35s ease, visibility .35s ease;
  }

  .splash-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-logo {
    width: 210px;
    height: 210px;
    object-fit: contain;
    display: block;
  }

  /* ===== Category delete button ===== */
  .category {
    position: relative;
    padding-right: 30px;
  }

  .category-delete {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    color: #a5aeb9;
    font-size: 16px;
    line-height: 20px;
    text-align: center;
    padding: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .category-delete:hover {
    background: #eef2f6;
    color: #4e5968;
  }

  .sidebar.collapsed .category-delete {
    display: none;
  }


  /* ===== Splash mobile-view adjustment only ===== */
  .splash-screen {
    position: fixed !important;
    inset: auto !important;
    width: min(430px, 96vw) !important;
    height: min(764px, 92vh) !important;
    aspect-ratio: 9 / 16;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%);
    border-radius: 30px;
    overflow: hidden;
    border: 1px solid #e8edf2;
    box-shadow: 0 20px 60px rgba(15, 23, 42, .12);
  }

  .splash-logo {
    width: 135px !important;
    height: 135px !important;
  }


  /* ===== Fixed header logo addition only ===== */
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .header-logo {
    width: 27px;
    height: 27px;
    object-fit: contain;
    flex: 0 0 27px;
    display: block;
  }

  .brand span {
    display: block;
    white-space: nowrap;
  }


  /* ===== Header title styling adjustment only ===== */
  .brand span {
    background: #2f6fed;
    color: #ffffff;
    font-size: 21px;
    font-weight: 800;
    line-height: 1;
    padding: 4px 3px 3px;
    letter-spacing: -0.6px;
  }


  /* ===== Title box size adjustment only ===== */
  .brand span {
    display: inline-block;
    width: fit-content;
    padding: 2px 1px 2px !important;
    line-height: 1 !important;
  }


  /* ===== Blue title background vertical spacing only ===== */
  .brand span {
    padding-top: 0px !important;
    padding-bottom: 1px !important;
  }


  /* ===== Category add modal ===== */
  .category-modal-backdrop {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(25, 31, 40, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, visibility .18s ease;
  }

  .category-modal-backdrop.show {
    opacity: 1;
    visibility: visible;
  }

  .category-modal {
    width: min(290px, 88%);
    background: #ffffff;
    border: 1px solid #e8edf3;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.14);
    transform: translateY(6px) scale(.98);
    transition: transform .18s ease;
  }

  .category-modal-backdrop.show .category-modal {
    transform: translateY(0) scale(1);
  }

  .category-modal-title {
    font-size: 17px;
    font-weight: 800;
    color: #191f28;
    letter-spacing: -0.35px;
    margin-bottom: 6px;
  }

  .category-modal-desc {
    font-size: 12px;
    color: #8b95a1;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .category-modal-input {
    width: 100%;
    height: 42px;
    border: 1px solid #dfe5ec;
    border-radius: 11px;
    outline: none;
    padding: 0 12px;
    font-size: 13px;
    color: #333d4b;
    background: #ffffff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .category-modal-input::placeholder {
    color: #b0b8c1;
  }

  .category-modal-input:focus {
    border-color: #9fc0ff;
    box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.08);
  }

  .category-modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .category-modal-btn {
    flex: 1;
    height: 38px;
    border: none;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .category-modal-btn.cancel {
    background: #f2f4f6;
    color: #6b7684;
  }

  .category-modal-btn.cancel:hover {
    background: #e9edf2;
  }

  .category-modal-btn.confirm {
    background: #eaf2ff;
    color: #2f6fed;
  }

  .category-modal-btn.confirm:hover {
    background: #deebff;
  }

  .count-badge {
    font-size:10px;color:#a1a8b3;background:#eef1f4;border-radius:8px;padding:1px 6px;margin-left:4px;
  }
  .category.active .count-badge { background:#dbe9ff;color:#1b64da; }
  .sidebar.collapsed .count-badge { display:none; }
  @keyframes blink { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

</style>
</head>

                <button class="upload-btn" id="uploadFileBtn" title="사진 업로드">＋</button>
                <input class="text-input" id="uploadTextInput" placeholder="메모를 남기면 분류에 참고해요 (선택)" />
                <button class="send-btn" id="uploadSendBtn">↑</button>
              </div>
              <div class="composer-note" id="uploadPreviewNote" style="display:none;"></div>
            </div>
          </div>

          <div class="chat-wrap" id="retrieveView">
            <div class="empty-state" id="retrieveEmpty">
              <div>
                <div class="empty-title">찾고 싶은 정보를 입력하세요</div>
                <div class="empty-desc">
                  저장된 텍스트, 세부 내용, URL을<br />
                  검색 결과로 불러오는 화면입니다.
                </div>
                <div id="suggestChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;">
                  <button class="suggest-chip" style="border:1px solid #e2ebfb;background:#f4f8ff;color:#2f6fed;font-size:11px;padding:7px 12px;border-radius:20px;cursor:pointer;">저번에 본 파스타집 어디였지?</button>
                  <button class="suggest-chip" style="border:1px solid #e2ebfb;background:#f4f8ff;color:#2f6fed;font-size:11px;padding:7px 12px;border-radius:20px;cursor:pointer;">초록색 원피스 어디서 팔았지?</button>
                  <button class="suggest-chip" style="border:1px solid #e2ebfb;background:#f4f8ff;color:#2f6fed;font-size:11px;padding:7px 12px;border-radius:20px;cursor:pointer;">지난주 공부 내용 보여줘</button>
                </div>
              </div>
            </div>
            <div id="retrieveMessages"></div>

            <div class="composer">
              <div class="composer-top">
                <input class="text-input" id="retrieveTextInput" placeholder="찾고 싶은 정보를 입력하세요" />
                <button class="send-btn" id="retrieveSendBtn">↑</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

<div id="categoryModalBackdrop" style="position:absolute;inset:0;z-index:100;background:rgba(25,31,40,.18);display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s ease;">
  <div style="width:min(290px,88%);background:#fff;border:1px solid #e8edf3;border-radius:18px;padding:20px;box-shadow:0 18px 45px rgba(15,23,42,.14);transform:translateY(6px) scale(.98);transition:transform .18s ease;" id="categoryModal">
    <div style="font-size:17px;font-weight:800;color:#191f28;margin-bottom:6px;">새 카테고리 추가</div>
    <div style="font-size:12px;color:#8b95a1;line-height:1.5;margin-bottom:14px;">카테고리 이름을 입력해 주세요.</div>
    <input type="text" id="categoryNameInput" style="width:100%;height:42px;border:1px solid #dfe5ec;border-radius:11px;outline:none;padding:0 12px;font-size:13px;color:#333d4b;" placeholder="예: 자격증" maxlength="20" />
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="categoryModalCancel" style="flex:1;height:38px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:#f2f4f6;color:#6b7684;">취소</button>
      <button id="categoryModalConfirm" style="flex:1;height:38px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:#eaf2ff;color:#2f6fed;">추가</button>
    </div>
  </div>
</div>

<div id="itemModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <button id="modalClose" style="position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:18px;cursor:pointer;z-index:2;">✕</button>
  <div id="modalContent" style="background:#fff;border-radius:20px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;padding:20px;position:relative;"></div>
</div>
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#191f28;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:.25s ease;z-index:10000;pointer-events:none;white-space:nowrap;"></div>


<script>
  // ===== API 설정 =====
  const API_BASE = window.location.port === '3000'
    ? ''
    : 'http://44.196.48.25:3000';
  const UPLOAD_INTERVAL_MS = 3200;

  const sidebar = document.getElementById('sidebar');
  const toggleSidebar = document.getElementById('toggleSidebar');
  const app = document.getElementById('app');
  const homeView = document.getElementById('homeView');
  const uploadView = document.getElementById('uploadView');
  const retrieveView = document.getElementById('retrieveView');
  const goUpload = document.getElementById('goUpload');
  const goRetrieve = document.getElementById('goRetrieve');
  const modeButton = document.getElementById('modeButton');
  const backHome = document.getElementById('backHome');
  const categoryList = document.getElementById('categoryList');

  let currentMode = 'home';
  let currentCategory = '전체';

  toggleSidebar.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    toggleSidebar.textContent = sidebar.classList.contains('collapsed') ? '›' : '‹';
  });

  function showMode(mode) {
    currentMode = mode;
    homeView.classList.toggle('hidden', mode !== 'home');
    uploadView.classList.toggle('active', mode === 'upload');
    retrieveView.classList.toggle('active', mode === 'retrieve');
    app.classList.toggle('chat-mode', mode !== 'home');

    if (mode === 'upload') {
      modeButton.textContent = '불러오기';
      modeButton.style.display = '';
    } else if (mode === 'retrieve') {
      modeButton.textContent = '사진 업로드';
      modeButton.style.display = '';
    } else {
      modeButton.style.display = 'none';
      loadHomeList();
    }
  }

  goUpload.addEventListener('click', () => showMode('upload'));
  goRetrieve.addEventListener('click', () => showMode('retrieve'));
  backHome.addEventListener('click', () => showMode('home'));
  modeButton.addEventListener('click', () => {
    showMode(currentMode === 'upload' ? 'retrieve' : 'upload');
  });

  function activateCategory(button) {
    document.querySelectorAll('.category').forEach(x => x.classList.remove('active'));
    button.classList.add('active');
    currentCategory = button.dataset.cat;

    // 업로드/검색 화면에서 카테고리를 고르면 홈으로 돌아가 목록을 보여줌
    // (showMode('home') 내부에서 loadHomeList()를 호출하므로 중복 호출하지 않음)
    if (currentMode !== 'home') {
      showMode('home');
    } else {
      loadHomeList();
    }
  }

  // 카테고리 클릭(선택) / 삭제(×) 처리 — 하나의 리스너로 통합
  categoryList.addEventListener('click', (e) => {
    const delBtn = e.target.closest('.cat-del');
    const btn = e.target.closest('.category');
    if (!btn) return;

    if (delBtn) {
      e.stopPropagation();
      if (btn.dataset.cat === '전체') {
        showToast('"전체" 카테고리는 삭제할 수 없어요');
        return;
      }
      const wasActive = btn.classList.contains('active');
      btn.remove();
      if (typeof saveCategoryState === 'function') saveCategoryState();
      if (wasActive) {
        const first = categoryList.querySelector('.category');
        if (first) activateCategory(first);
      }
      return;
    }

    activateCategory(btn);
  });

  /* Splash: show briefly then reveal UI */
  window.addEventListener('load', () => {
    const splash = document.getElementById('splashScreen');
    setTimeout(() => {
      splash.classList.add('hide');
      setTimeout(() => splash.remove(), 400);
    }, 1200);
  });

  // ===== 유틸 =====
  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }
  function imgUrl(path) {
    if (!path) return '';
    return path.startsWith('http') ? path : API_BASE + path;
  }
  function onImgError(imgEl) {
    imgEl.style.background = '#f4f6f8';
    imgEl.removeAttribute('src');
  }
  window.onImgError = onImgError;

  function appendMessage(containerEl, html, who) {
    const msgDiv = document.createElement('div');
    msgDiv.style.cssText = `margin:8px 16px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.6;max-width:85%;word-break:break-word;${who === 'user' ? 'margin-left:auto;background:#edf4ff;color:#1b64da;' : 'background:#f4f6f8;color:#333d4b;'}`;
    msgDiv.innerHTML = html;
    containerEl.appendChild(msgDiv);
    msgDiv.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return msgDiv;
  }

  function appendTyping(containerEl) {
    const div = document.createElement('div');
    div.style.cssText = 'margin:8px 16px;padding:12px 14px;border-radius:14px;background:#f4f6f8;max-width:70px;';
    div.innerHTML = '<span style="display:inline-block;width:5px;height:5px;background:#8b95a1;border-radius:50%;margin:0 2px;animation:blink 1.2s infinite ease-in-out;"></span><span style="display:inline-block;width:5px;height:5px;background:#8b95a1;border-radius:50%;margin:0 2px;animation:blink 1.2s infinite ease-in-out .2s;"></span><span style="display:inline-block;width:5px;height:5px;background:#8b95a1;border-radius:50%;margin:0 2px;animation:blink 1.2s infinite ease-in-out .4s;"></span>';
    containerEl.appendChild(div);
    div.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return div;
  }

  // ===== 업로드 화면 =====
  const uploadFileBtn = document.getElementById('uploadFileBtn');
  const uploadTextInput = document.getElementById('uploadTextInput');
  const uploadSendBtn = document.getElementById('uploadSendBtn');
  const uploadEmpty = document.getElementById('uploadEmpty');
  const uploadMessages = document.getElementById('uploadMessages');
  const uploadPreviewNote = document.getElementById('uploadPreviewNote');

  const uploadFileInput = document.createElement('input');
  uploadFileInput.type = 'file';
  uploadFileInput.accept = 'image/*';
  uploadFileInput.multiple = true;
  uploadFileInput.style.display = 'none';
  document.body.appendChild(uploadFileInput);

  let pendingFiles = [];
  let isUploading = false;

  function refreshPreviewNote() {
    if (pendingFiles.length === 0) {
      uploadPreviewNote.style.display = 'none';
      uploadPreviewNote.innerHTML = '';
      return;
    }
    uploadPreviewNote.style.display = 'flex';
    uploadPreviewNote.style.cssText += 'flex-wrap:wrap;align-items:center;gap:6px;padding:6px;background:#f8fafc;border-radius:10px;margin-top:7px;';
    uploadPreviewNote.innerHTML = pendingFiles.map((f, idx) => {
      const url = URL.createObjectURL(f);
      return `<div style="position:relative;width:40px;height:40px;flex-shrink:0;">
        <img src="${url}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;" title="${esc(f.name)}"/>
        <button onclick="window.__removeFile(${idx})" style="position:absolute;top:-5px;right:-5px;width:16px;height:16px;border:none;background:#191f28;color:#fff;border-radius:50%;cursor:pointer;font-size:9px;line-height:16px;padding:0;">✕</button>
      </div>`;
    }).join('') + `<span style="font-size:11px;color:#6b7684;">${pendingFiles.length}장 선택됨</span>`;
  }
  window.__clearFiles = clearPendingFiles;
  window.__removeFile = (idx) => {
    pendingFiles.splice(idx, 1);
    refreshPreviewNote();
  };

  function addPendingFiles(files) {
    const imgFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (imgFiles.length === 0) return;
    pendingFiles = pendingFiles.concat(imgFiles);
    refreshPreviewNote();
  }

  function clearPendingFiles() {
    pendingFiles = [];
    uploadFileInput.value = '';
    refreshPreviewNote();
  }

  uploadFileBtn.addEventListener('click', () => uploadFileInput.click());
  uploadFileInput.addEventListener('change', () => addPendingFiles(uploadFileInput.files));

  document.addEventListener('paste', (e) => {
    if (currentMode !== 'upload') return;
    const items = e.clipboardData?.items;
    if (!items) return;
    const files = [];
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) files.push(file);
      }
    }
    if (files.length > 0) {
      e.preventDefault();
      addPendingFiles(files);
    }
  });

  // 드래그 앤 드롭은 아래 "추가 기능" 섹션에서 오버레이와 함께 처리

  async function submitUpload() {
    if (isUploading) return;
    if (pendingFiles.length === 0) {
      alert('먼저 사진을 선택해주세요. (+ 버튼, 붙여넣기, 드래그 앤 드롭)');
      return;
    }

    isUploading = true;
    uploadSendBtn.disabled = true;
    if (uploadEmpty) uploadEmpty.style.display = 'none';

    const filesToUpload = pendingFiles;
    const memo = uploadTextInput.value.trim();
    uploadTextInput.value = '';

    let okCount = 0, failCount = 0;
    const failedFiles = [];

    for (let i = 0; i < filesToUpload.length; i++) {
      const file = filesToUpload[i];
      const progressLabel = filesToUpload.length > 1 ? ` (${i + 1}/${filesToUpload.length})` : '';
      appendMessage(uploadMessages, `📎 ${esc(file.name)} 분석 중...${progressLabel}`, 'user');

      const form = new FormData();
      form.append('image', file);
      if (memo) form.append('memo', memo);

      try {
        const res = await fetch(API_BASE + '/api/items', { method: 'POST', body: form });
        const json = await res.json();

        if (!res.ok) {
          if (json.error?.code === 'RATE_LIMITED') {
            await new Promise(r => setTimeout(r, UPLOAD_INTERVAL_MS));
            const retryRes = await fetch(API_BASE + '/api/items', { method: 'POST', body: form });
            const retryJson = await retryRes.json();
            if (retryRes.ok) {
              okCount++;
              appendUploadResult(retryJson);
            } else {
              failCount++;
              failedFiles.push(file);
              appendMessage(uploadMessages, `❌ ${esc(retryJson.error?.message || '실패')}`, 'bot');
            }
          } else {
            failCount++;
            failedFiles.push(file);
            appendMessage(uploadMessages, `❌ ${esc(json.error?.message || '실패')}`, 'bot');
          }
        } else {
          okCount++;
          appendUploadResult(json);
        }
      } catch (e) {
        failCount++;
        failedFiles.push(file);
        appendMessage(uploadMessages, '❌ 네트워크 오류가 발생했어요.', 'bot');
      }

      if (i < filesToUpload.length - 1) {
        await new Promise(r => setTimeout(r, UPLOAD_INTERVAL_MS));
      }
    }

    if (filesToUpload.length > 1) {
      appendMessage(uploadMessages, `📦 총 ${filesToUpload.length}장 중 <b>${okCount}장 성공</b>${failCount > 0 ? `, ${failCount}장 실패` : ''}`, 'bot');
    }

    // 실패한 파일은 다시 선택할 수 있도록 유지
    pendingFiles = failedFiles;
    refreshPreviewNote();
    if (failedFiles.length > 0) {
      showToast(`${failedFiles.length}개 파일이 실패했어요. 다시 시도해주세요.`);
    }

    isUploading = false;
    uploadSendBtn.disabled = false;
  }

  function appendUploadResult(json) {
    let html = `✅ <b>[${esc(json.category)}]</b> ${esc(json.title)}<br/><span style="color:#6b7684;">${esc(json.summary)}</span>`;
    if (json.ai_fallback) {
      html = `<span style="font-size:10px;background:#fff4e0;color:#b8720a;padding:2px 8px;border-radius:10px;">AI 분석 실패 · 기본값 사용</span><br/>` + html;
    }
    if (json.image_url) {
      html += `<br/><img src="${esc(imgUrl(json.image_url))}" onerror="onImgError(this)" style="width:100%;max-width:180px;border-radius:10px;margin-top:8px;" />`;
    }
    html += `<br/><button onclick="window.__goHome()" style="margin-top:8px;border:none;background:#eaf2ff;color:#2f6fed;font-size:11px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;">갤러리에서 보기</button>`;
    appendMessage(uploadMessages, html, 'bot');
  }

  window.__goHome = () => showMode('home');

  uploadSendBtn.addEventListener('click', submitUpload);
  uploadTextInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitUpload(); });

  // ===== 검색 화면 =====
  const retrieveTextInput = document.getElementById('retrieveTextInput');
  const retrieveSendBtn = document.getElementById('retrieveSendBtn');
  const retrieveEmpty = document.getElementById('retrieveEmpty');
  const retrieveMessages = document.getElementById('retrieveMessages');
  let isSearching = false;

  async function submitSearch() {
    if (isSearching) return;
    const query = retrieveTextInput.value.trim();
    if (!query) return;

    isSearching = true;
    retrieveSendBtn.disabled = true;
    if (retrieveEmpty) retrieveEmpty.style.display = 'none';

    appendMessage(retrieveMessages, esc(query), 'user');
    retrieveTextInput.value = '';
    const typingEl = appendTyping(retrieveMessages);

    try {
      const res = await fetch(API_BASE + '/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const json = await res.json();
      typingEl.remove();

      if (!res.ok) {
        appendMessage(retrieveMessages, '❌ ' + esc(json.error?.message || '검색 실패'), 'bot');
      } else {
        let html = '';
        if (json.fallback) {
          html += `<span style="font-size:10px;background:#fff4e0;color:#b8720a;padding:2px 8px;border-radius:10px;">정확히 찾지 못해 전체 목록을 보여드려요</span><br/>`;
        }
        html += `💬 ${esc(json.answer)}`;
        if (json.items && json.items.length > 0) {
          html += `<div style="margin-top:6px;font-size:11px;color:#8b95a1;">${json.items.length}개 찾았어요</div>`;
          html += '<div style="margin-top:6px;">';
          json.items.forEach(item => {
            allItems = allItems.filter(a => a.id !== item.id).concat([item]);
            html += `<div class="search-result-card" data-id="${esc(item.id)}" style="display:flex;gap:10px;align-items:center;margin-top:8px;padding:10px;background:#fff;border-radius:12px;border:1px solid #edf0f3;cursor:pointer;">`;
            if (item.image_url) {
              html += `<img src="${esc(imgUrl(item.image_url))}" onerror="onImgError(this)" style="width:64px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0;" />`;
            }
            html += `<div style="min-width:0;"><div style="font-weight:700;font-size:12px;">${esc(item.title)}</div><div style="font-size:11px;color:#8b95a1;margin-top:3px;">${esc(item.summary)}</div><div style="font-size:10px;color:#3182f6;margin-top:3px;">${esc(item.category)}</div></div>`;
            html += `</div>`;
          });
          html += '</div>';
        } else {
          html += `<div style="margin-top:8px;color:#8b95a1;font-size:12px;">검색 결과가 없어요.</div>`;
        }
        const msgEl = appendMessage(retrieveMessages, html, 'bot');
        msgEl.querySelectorAll('.search-result-card').forEach(card => {
          card.addEventListener('click', () => showItemModal(card.dataset.id));
        });
      }
    } catch (e) {
      typingEl.remove();
      appendMessage(retrieveMessages, '❌ 네트워크 오류가 발생했어요.', 'bot');
    }

    isSearching = false;
    retrieveSendBtn.disabled = false;
  }

  retrieveSendBtn.addEventListener('click', submitSearch);
  retrieveTextInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitSearch(); });

  // ===== 홈 목록 =====
  const homeItems = document.getElementById('homeItems');
  let currentSort = 'newest';

  function formatRelativeDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffDay = Math.floor(diffMs / 86400000);
    if (diffDay === 0) return '오늘';
    if (diffDay === 1) return '1일 전';
    if (diffDay < 7) return `${diffDay}일 전`;
    return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  }

  function sortItems(items) {
    const sorted = [...items];
    if (currentSort === 'oldest') {
      sorted.reverse();
    } else if (currentSort === 'category') {
      sorted.sort((a, b) => (a.category || '').localeCompare(b.category || ''));
    }
    // 'newest'는 API가 최신순으로 주므로 그대로
    return sorted;
  }

  async function loadHomeList() {
    homeItems.innerHTML = '';
    try {
      const res = await fetch(API_BASE + '/api/items');
      const json = await res.json();
      let items = json.items || [];

      if (typeof updateStats === 'function') updateStats(json);

      if (currentCategory && currentCategory !== '전체') {
        items = items.filter(it => it.category === currentCategory);
      }

      items = sortItems(items);

      if (items.length === 0) {
        homeItems.innerHTML = `<div style="text-align:center;color:#8b95a1;font-size:12px;padding:24px 10px;">${currentCategory === '전체' ? '저장된 항목이 없습니다. 사진을 업로드해보세요.' : `"${esc(currentCategory)}" 카테고리에는 아직 항목이 없어요.`}</div>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.style.cssText = 'display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border-radius:14px;border:1px solid #edf0f3;margin-top:12px;cursor:pointer;';
        card.innerHTML = `
          ${item.image_url ? `<img src="${esc(imgUrl(item.image_url))}" onerror="onImgError(this)" style="width:56px;height:56px;object-fit:cover;border-radius:10px;flex-shrink:0;" />` : ''}
          <div style="min-width:0;flex:1;">
            <div style="font-size:13px;font-weight:700;color:#191f28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.title)}</div>
            <div style="font-size:11px;color:#8b95a1;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(item.summary)}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
              <span style="font-size:10px;color:#3182f6;">${esc(item.category)}</span>
              <span style="font-size:10px;color:#c1c8d1;">${esc(formatRelativeDate(item.created_at))}</span>
            </div>
          </div>`;
        card.addEventListener('click', () => showItemModal(item.id));
        homeItems.appendChild(card);
      });
    } catch (e) {
      console.error('loadHomeList failed:', e.message);
      homeItems.innerHTML = '<div style="text-align:center;color:#e53e3e;font-size:12px;padding:20px;">목록을 불러올 수 없어요.</div>';
    }
  }

  loadHomeList();

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    currentSort = e.target.value;
    loadHomeList();
  });

  // ===== 추가 기능: 토스트 =====
  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(20px)'; }, 2600);
  }

  // ===== 추가 기능: 대화 초기화 =====
  const clearChatBtn = document.getElementById('clearChatBtn');
  clearChatBtn.addEventListener('click', () => {
    if (currentMode === 'upload') {
      uploadMessages.innerHTML = '';
      if (uploadEmpty) uploadEmpty.style.display = '';
    } else if (currentMode === 'retrieve') {
      retrieveMessages.innerHTML = '';
      if (retrieveEmpty) retrieveEmpty.style.display = '';
    }
  });

  // ===== 추가 기능: 드래그 오버레이 =====
  const dropOverlay = document.getElementById('dropOverlay');
  uploadView.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropOverlay.style.display = 'flex';
  });
  uploadView.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropOverlay.style.display = 'none';
  });
  uploadView.addEventListener('drop', (e) => {
    e.preventDefault();
    dropOverlay.style.display = 'none';
    addPendingFiles(e.dataTransfer.files);
  });

  // ===== 추가 기능: 검색 예시 칩 =====
  document.getElementById('suggestChips').addEventListener('click', (e) => {
    if (e.target.classList.contains('suggest-chip')) {
      retrieveTextInput.value = e.target.textContent;
      submitSearch();
    }
  });

  // ===== 추가 기능: 상세 모달 + 삭제 =====
  const itemModal = document.getElementById('itemModal');
  const modalContent = document.getElementById('modalContent');
  const modalClose = document.getElementById('modalClose');
  let allItems = [];

  function showItemModal(id) {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    modalContent.innerHTML = `
      ${item.image_url ? `<img id="modalImg" src="${esc(imgUrl(item.image_url))}" onerror="onImgError(this)" style="width:100%;border-radius:12px;margin-bottom:14px;cursor:zoom-in;transition:transform .2s ease;" />` : ''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:10px;color:#3182f6;font-weight:700;">${esc(item.category)}</span>
        <span style="font-size:10px;color:#c1c8d1;">${esc(formatRelativeDate(item.created_at))}</span>
      </div>
      <div style="font-size:17px;font-weight:800;margin-bottom:8px;">${esc(item.title)}</div>
      <div style="font-size:13px;color:#4e5968;line-height:1.6;margin-bottom:12px;">${esc(item.summary)}</div>
      ${item.memo ? `<div style="font-size:11px;color:#2f6fed;background:#eaf2ff;padding:8px 10px;border-radius:10px;margin-bottom:10px;">📝 ${esc(item.memo)}</div>` : ''}
      ${item.ocr_text ? `<div style="font-size:11px;color:#8b95a1;background:#f8fafc;padding:10px;border-radius:10px;line-height:1.5;white-space:pre-wrap;margin-bottom:10px;">${esc(item.ocr_text)}</div>` : ''}
      ${item.tags && item.tags.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">${item.tags.map(t => `<span class="modal-tag" data-tag="${esc(t)}" style="font-size:10px;background:#edf4ff;color:#2f6fed;padding:4px 8px;border-radius:12px;cursor:pointer;">#${esc(t)}</span>`).join('')}</div>` : ''}
      <button onclick="window.__deleteItem('${esc(item.id)}')" style="width:100%;margin-top:10px;padding:12px;border:1px solid #ffd7d7;background:#fff5f5;color:#e53e3e;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;">삭제하기</button>
    `;
    itemModal.style.display = 'flex';

    // 이미지 확대 토글
    const modalImg = document.getElementById('modalImg');
    if (modalImg) {
      let zoomed = false;
      modalImg.addEventListener('click', () => {
        zoomed = !zoomed;
        modalImg.style.transform = zoomed ? 'scale(1.8)' : 'scale(1)';
        modalImg.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
      });
    }

    // 태그 클릭 → 검색으로 이동
    modalContent.querySelectorAll('.modal-tag').forEach(tagEl => {
      tagEl.addEventListener('click', () => {
        itemModal.style.display = 'none';
        showMode('retrieve');
        retrieveTextInput.value = tagEl.dataset.tag;
        submitSearch();
      });
    });

    // 브라우저 뒤로가기로 모달 닫기 지원
    history.pushState({ modal: 'item' }, '');
  }
  window.showItemModal = showItemModal;

  window.__deleteItem = async (id) => {
    if (!confirm('이 항목을 삭제할까요?')) return;
    try {
      const res = await fetch(API_BASE + '/api/items/' + encodeURIComponent(id), { method: 'DELETE' });
      if (res.ok) {
        itemModal.style.display = 'none';
        showToast('삭제되었어요');
        loadHomeList();
      } else {
        showToast('삭제에 실패했어요');
      }
    } catch (e) {
      showToast('네트워크 오류');
    }
  };

  modalClose.addEventListener('click', () => { itemModal.style.display = 'none'; if (history.state?.modal === 'item') history.back(); });
  itemModal.addEventListener('click', (e) => { if (e.target === itemModal) { itemModal.style.display = 'none'; if (history.state?.modal === 'item') history.back(); } });
  window.addEventListener('popstate', () => {
    itemModal.style.display = 'none';
    closeCategoryModal();
  });

  // ===== 추가 기능: 카테고리 배지 + 통계 업데이트 =====
  function updateStats(json) {
    const items = json.items || [];
    allItems = items;
    const counts = json.counts || {};
    document.querySelectorAll('.count-badge').forEach(badge => {
      const cat = badge.id.replace('cnt-', '');
      badge.textContent = counts[cat] !== undefined ? counts[cat] : 0;
    });
    document.getElementById('statTotal').textContent = items.length;
    const todayStr = new Date().toISOString().slice(0, 10);
    document.getElementById('statToday').textContent = items.filter(it => (it.created_at || '').slice(0, 10) === todayStr).length;
  }

  // ===== showMode 확장: 초기화 버튼 표시 =====
  const origShowMode = showMode;
  showMode = function(mode) {
    origShowMode(mode);
    clearChatBtn.style.display = (mode === 'upload' || mode === 'retrieve') ? '' : 'none';
  };
  // 재적용
  showMode('home');

  // ===== 카테고리 추가/삭제 =====
  const addCategoryBtn = document.getElementById('addCategoryBtn');
  const categoryModalBackdrop = document.getElementById('categoryModalBackdrop');
  const categoryNameInput = document.getElementById('categoryNameInput');
  const categoryModalCancel = document.getElementById('categoryModalCancel');
  const categoryModalConfirm = document.getElementById('categoryModalConfirm');
  const CUSTOM_CAT_KEY = 'scraper_custom_categories';

  function openCategoryModal() {
    categoryNameInput.value = '';
    categoryNameInput.placeholder = '예: 자격증';
    categoryModalBackdrop.style.opacity = '1';
    categoryModalBackdrop.style.visibility = 'visible';
    categoryModalBackdrop.querySelector('#categoryModal').style.transform = 'translateY(0) scale(1)';
    setTimeout(() => categoryNameInput.focus(), 120);
    history.pushState({ modal: 'category' }, '');
  }

  function closeCategoryModal() {
    categoryModalBackdrop.style.opacity = '0';
    categoryModalBackdrop.style.visibility = 'hidden';
    categoryModalBackdrop.querySelector('#categoryModal').style.transform = 'translateY(6px) scale(.98)';
  }

  function saveCategoryState() {
    const remaining = [...document.querySelectorAll('.category')].map(btn => btn.dataset.cat);
    localStorage.setItem(CUSTOM_CAT_KEY, JSON.stringify(remaining.filter(c => c !== '전체')));
  }

  function addCategoryButton(name, activate) {
    const btn = document.createElement('button');
    btn.className = 'category';
    btn.dataset.cat = name;
    btn.innerHTML = `${esc(name)} <span class="count-badge" id="cnt-${esc(name)}">0</span> <span class="cat-del" style="margin-left:4px;font-size:14px;color:#a5aeb9;cursor:pointer;">×</span>`;
    categoryList.appendChild(btn);
    if (activate) activateCategory(btn);
    return btn;
  }

  // 새로고침 시 저장된 카테고리 목록(기본+커스텀, 삭제 반영)으로 사이드바 복원
  function restoreCategoryState() {
    const saved = localStorage.getItem(CUSTOM_CAT_KEY);
    if (saved === null) return; // 저장된 게 없으면 HTML 기본값 그대로 사용

    let list;
    try { list = JSON.parse(saved); } catch (e) { return; }

    // 기존 "전체" 제외 카테고리 버튼 모두 제거 후 저장된 목록으로 재생성
    [...document.querySelectorAll('.category')].forEach(btn => {
      if (btn.dataset.cat !== '전체') btn.remove();
    });
    list.forEach(name => addCategoryButton(name, false));
  }

  function createCategoryFromModal() {
    const trimmed = categoryNameInput.value.trim();
    if (!trimmed) { categoryNameInput.focus(); return; }

    const exists = [...document.querySelectorAll('.category')].some(btn => btn.dataset.cat === trimmed);
    if (exists) {
      categoryNameInput.value = '';
      categoryNameInput.placeholder = '이미 존재하는 카테고리입니다.';
      categoryNameInput.focus();
      return;
    }

    addCategoryButton(trimmed, true);
    saveCategoryState();
    closeCategoryModal();
  }

  addCategoryBtn.addEventListener('click', openCategoryModal);
  categoryModalCancel.addEventListener('click', closeCategoryModal);
  categoryModalConfirm.addEventListener('click', createCategoryFromModal);
  categoryNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') createCategoryFromModal();
    if (e.key === 'Escape') closeCategoryModal();
  });
  categoryModalBackdrop.addEventListener('click', (e) => {
    if (e.target === categoryModalBackdrop) closeCategoryModal();
  });

  restoreCategoryState();

  // ===== 오프라인 감지 =====
  function updateOnlineStatus() {
    if (!navigator.onLine) {
      showToast('오프라인 상태예요. 인터넷 연결을 확인해주세요.');
    }
  }
  window.addEventListener('offline', updateOnlineStatus);
  window.addEventListener('online', () => showToast('다시 연결되었어요.'));
  updateOnlineStatus();
</script>

</body>
</html>
